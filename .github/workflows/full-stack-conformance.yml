# OpenID conformance harness for the Inji stack.
#
# On every push and pull request:
#   tests    - the harness's own tests: normalisation against real suite logs, the gate,
#              the runner-to-testrig contract, and a scan proving no private key material
#              is committed.
#   compose  - the Docker Compose stack resolves under every profile.
#
# On demand (Actions tab -> Run workflow, choosing verify, certify or combined) and weekly
# (combined):
#   conformance - one command, run-full-stack-conformance.sh: brings up the conformance
#                 suite with Inji Verify, Inji Certify or both, runs the OID4VP 1.0 Final
#                 verifier plan and/or the OID4VCI 1.0 issuer plan, and fails the build if
#                 any module regresses against the recorded baseline
#                 (configs/contract/expected-failures.json). The result, the consolidated
#                 report and badge, and the suite's logs are kept as a build artifact.
#
# The conformance job needs a public HTTPS hostname: Inji Verify bakes it into the
# response_uri the suite must reach, and Inji Certify into its credential issuer URL. Add two
# repository secrets:
#   PUBLIC_HOST       an ngrok static domain, hostname only
#   NGROK_AUTHTOKEN   the token for that ngrok account
# A free ngrok account allows one session at a time, so don't run the job while the same
# domain is in use on a laptop. Without the secrets the job is skipped, not failed.

name: conformance

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      component:
        description: "Which plan(s) to run"
        type: choice
        options: [combined, verify, certify]
        default: combined
      latest_suite:
        description: "Also compare against the newest conformance suite (never fails the build)"
        type: boolean
        default: false
  schedule:
    - cron: "30 2 * * 1"   # Mondays 02:30 UTC

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Harness tests
        run: python -m pytest tests/ -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stack resolves under every profile
        working-directory: docker
        env:
          PUBLIC_HOST: ci.example.invalid
        run: |
          set -euo pipefail
          docker compose --env-file /dev/null config --services
          docker compose --env-file /dev/null --profile verify config --services
          docker compose --env-file /dev/null --profile verify --profile tunnel config --services
          docker compose --env-file /dev/null --profile certify config --services
          docker compose --env-file /dev/null --profile verify --profile certify config --services

  conformance:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [tests, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      COMPONENT: ${{ inputs.component || 'combined' }}
    steps:
      - name: Skip unless the public-host secrets are configured
        id: secrets
        run: |
          if [ -n "$PUBLIC_HOST" ] && [ -n "$NGROK_AUTHTOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PUBLIC_HOST / NGROK_AUTHTOKEN secrets not set; conformance run skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runner and key-generation dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt cryptography

      - name: Generate the test keys (never committed)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # The verifier plan's test credential signing key, from the suite's own script.
          git clone --depth 1 https://gitlab.com/openid/conformance-suite.git /tmp/conformance-suite
          mkdir -p configs/keys
          python /tmp/conformance-suite/scripts/generate-vp-test-cert.py \
            --hostname "$PUBLIC_HOST" \
            --output configs/keys/vp-signing-jwk.json --ca-output configs/keys/vp-test-ca.pem
          # The issuer plan's two wallet clients (private_key_jwt + DPoP).
          python scripts/generate-client-jwks.py

      - name: Per-run settings
        if: steps.secrets.outputs.ready == 'true'
        run: |
          printf 'PUBLIC_HOST=%s\nNGROK_AUTHTOKEN=%s\n' "$PUBLIC_HOST" "$NGROK_AUTHTOKEN" > docker/.env
          python - <<'PY'
          import json, os
          host = os.environ["PUBLIC_HOST"]
          local = {"components": [
              {"component": "inji-verify", "alias": "injiverify-ci",
               "verifierRequest": {"clientId": f"redirect_uri:https://{host}/v1/verify/v2/vp-submission/direct-post"}},
              {"component": "inji-certify", "alias": "injicertify-ci",
               "planConfig": {"vci": {"credential_issuer_url": f"https://{host}"}}},
          ]}
          json.dump(local, open("configs/runner.local.json", "w"), indent=2)
          PY

      - name: Stack up, run the plan(s), stack down; the gate's verdict is this step's exit status
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ "$COMPONENT" = combined ]; then selection=(--combined); else selection=(--component "$COMPONENT"); fi
          ./run-full-stack-conformance.sh "${selection[@]}" --tunnel --out results

      # The run above uses the suite pinned in docker-compose.yml. This one tries the newest
      # suite and reports what would change, so a new suite release is seen the week it
      # lands; moving the pin stays a deliberate step (docs/TROUBLESHOOTING.md). Same job, so
      # the two runs never compete for the one ngrok domain.
      - name: Newest suite, compared with the pinned one (informational)
        if: >-
          always() && steps.secrets.outputs.ready == 'true'
          && (github.event_name == 'schedule' || inputs.latest_suite)
        continue-on-error: true
        run: |
          set -euo pipefail
          digest() { docker pull -q "$1" >/dev/null && docker image inspect "$1" --format '{{index .RepoDigests 0}}' | cut -d@ -f2; }
          SUITE_DIGEST=$(digest registry.gitlab.com/openid/conformance-suite:latest)
          SUITE_NGINX_DIGEST=$(digest registry.gitlab.com/openid/conformance-suite/nginx:latest)
          export SUITE_DIGEST SUITE_NGINX_DIGEST
          {
            echo "## Newest conformance suite"
            echo
            echo "Suite \`$SUITE_DIGEST\`, nginx \`$SUITE_NGINX_DIGEST\`."
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "$SUITE_DIGEST" docker/docker-compose.yml; then
            echo "Same as the pinned suite; nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$COMPONENT" = combined ]; then selection=(--combined); else selection=(--component "$COMPONENT"); fi
          ./run-full-stack-conformance.sh "${selection[@]}" --tunnel --out results-latest-suite || true
          python -m runner.diff results/conformance.json results-latest-suite/conformance.json \
            --markdown results-latest-suite/diff.md || true
          cat results-latest-suite/diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Show the consolidated report in the run summary
        if: always() && steps.secrets.outputs.ready == 'true'
        run: |
          if [ -f results/report/report.md ]; then cat results/report/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the result, the report and the suite's logs
        if: always() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ env.COMPONENT }}-${{ github.run_id }}
          path: |
            results/
            results-latest-suite/
            logs/
          if-no-files-found: warn
