# One public hostname for every component in the stack.
#
# A free ngrok account has one static domain, and both Inji components need to be reachable
# at a public HTTPS URL. Their paths do not overlap, so this gateway serves both:
#
#   Inji Certify: /v1/certify/... and its root /.well-known/ endpoints (OID4VCI issuer and
#                 OAuth authorisation-server metadata, JWKS, did:web document)
#   Inji Verify:  everything else -- the UI at / and its API at /v1/verify/... (its did:web
#                 document lives under /v1/verify/did.json, not at the root)
#
# Upstreams are resolved per request through Docker's DNS, so nginx starts even when only
# one component is up; the other's paths then answer 502.

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $verify  verify-ui:8000;
    set $certify certify-nginx:80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # ngrok terminates TLS and sets this; pass it on so the apps build https URLs.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Inji Verify long-polls request status for up to 55 seconds.
    proxy_read_timeout 70s;

    location /v1/certify/ {
        proxy_pass http://$certify;
    }

    # TEST SHIM -- read before trusting any Inji Certify result produced through it.
    #
    # Inji Certify 1.0's authorisation-server metadata cannot carry `authorization_endpoint`
    # (OAuthAuthorizationServerMetadataDTO has no such field), yet it advertises the
    # authorization_code grant. The OpenID Foundation issuer plan's FAPI 2.0 base requires the
    # field unconditionally, so without this shim no issuer module gets past its first check.
    # That is finding F-12, recorded as found.
    #
    # The shim injects the field, pointing at Certify's interactive authorization endpoint,
    # so the remaining checks -- pre-authorized code, DPoP, nonce, SD-JWT issuance -- can be
    # measured. The pre-authorized flow never calls this endpoint. Results obtained through
    # the shim are reported as such, never as an unqualified pass.
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://$certify;
        proxy_set_header Accept-Encoding "";          # sub_filter needs an uncompressed body
        sub_filter_types application/json;
        sub_filter_once on;
        sub_filter '"token_endpoint"' '"authorization_endpoint":"https://$host/v1/certify/oauth/iae","token_endpoint"';
    }

    location ~ ^/\.well-known/(openid-credential-issuer|jwks\.json|did\.json) {
        proxy_pass http://$certify;
    }

    location / {
        proxy_pass http://$verify;
    }
}
