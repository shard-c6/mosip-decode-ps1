# One stack for OpenID conformance testing of the Inji components.
#
# The OpenID Foundation conformance suite always runs. Components are added by profile,
# so each can be brought up on its own or together, as the problem statement asks:
#
#   docker compose --profile verify up -d                      Inji Verify + suite
#   docker compose --profile verify --profile tunnel up -d     ... plus the public tunnel
#   docker compose --profile certify up -d                     Inji Certify + suite
#   docker compose --profile verify --profile certify up -d    both
#
# Both components share one public hostname through the gateway (port 3000).
#
# Prefer scripts/stack.sh, which also waits until everything answers.
#
# Settings come from docker/.env (copy .env.example). PUBLIC_HOST is required for Inji
# Verify: it is baked into the response_uri the suite must reach, so it has to be a public
# HTTPS hostname -- an ngrok static domain, served by the `tunnel` service or by an ngrok
# agent run on the host.
#
# Compose resolves variables for every service, even in profiles not selected, so nothing
# here is marked required: that would break `--profile verify` for anyone without an ngrok
# token. scripts/stack.sh checks each setting only for the profiles that need it.
#
# Only one copy of this stack runs at a time: it publishes the suite on 8443/8444 and Inji
# Verify on 3000/8080.

name: inji-conformance

services:

  # --- OpenID Foundation conformance suite (always on) ------------------------------
  # Mirrors conformance-suite/docker-compose-prebuilt.yml, with a named volume for the
  # database instead of a bind mount into that repository.

  mongodb:
    image: ${MONGODB_IMAGE:-mongo:6.0.13}
    volumes:
      - suite-mongo:/data/db
    logging: &logging
      driver: json-file
      options:
        max-size: "500k"
        max-file: "5"

  server:
    # Pinned by digest: "latest" moves whenever the suite publishes, and the baseline only
    # means something against a known suite. This is the 27 Oct 2026 build. To move to a
    # newer suite, see docs/TROUBLESHOOTING.md, "Updating the conformance suite".
    image: registry.gitlab.com/openid/conformance-suite@${SUITE_DIGEST:-sha256:72c05c08950810de931c50c880862609e4bcb519e74f58645bb414c049301b76}
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      # Local developer profile: no login, no API token.
      SPRING_PROFILES_ACTIVE: dev
      # Dummy values, as in the suite's own compose file. The server refuses to start if
      # these are empty, even though the dev profile never uses them.
      OIDC_GOOGLE_CLIENTID: google-client
      OIDC_GOOGLE_SECRET: google-secret
      OIDC_GITLAB_CLIENTID: gitlab-client
      OIDC_GITLAB_SECRET: gitlab-secret
    depends_on:
      - mongodb
    logging: *logging

  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx@${SUITE_NGINX_DIGEST:-sha256:aa7b872505bf1ba061d24a8c4a06c6649075baad1936025ea3f5fdada7ca09f1}
    ports:
      - "8443:8443"
      - "8444:8444"
    networks:
      default:
        aliases:
          # Lets the suite's own requests to its public hostname reach nginx; inside a
          # container that name otherwise resolves to 127.0.0.1.
          - localhost.emobix.co.uk
    depends_on:
      - server
    logging: *logging

  # --- Inji Verify 1.0 (profile: verify) --------------------------------------------
  # Service names are fixed by the images: the UI's nginx proxies /v1/verify to
  # http://verify-service:8080, and the service reaches its database as `postgres`.

  verify-service:
    profiles: [verify]
    # MOSIP's QA build of release-1.0.x (commit 429293f, built 15 Oct 2026), pinned by digest
    # for the same reason as the suite. To re-run the earlier release instead, set
    # VERIFY_SERVICE_IMAGE=injistack/inji-verify-service:1.0.0-alpha.1 (and the UI below).
    image: ${VERIFY_SERVICE_IMAGE:-injistackqa/inji-verify-service@sha256:5e10da40e7ef68b04d0196f23abf45bb40ccc242d4672e2f4bd56a9b3b72eea6}
    platform: linux/amd64
    user: root
    ports:
      - "8080:8080"
    environment:
      active_profile_env: default
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: inji_verify
      DATABASE_SCHEMA: verify
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      INJI_VP_REQUEST_LONG_POLLING_TIMEOUT: "55000"
      INJI_VP_SUBMISSION_BASE_URL: https://${PUBLIC_HOST:-PUBLIC_HOST-not-set}/v1/verify
      INJI_DID_VERIFY_URI: did:web:${PUBLIC_HOST:-PUBLIC_HOST-not-set}:v1:verify
      INJI_DID_VERIFY_PUBLIC_KEY_URI: did:web:${PUBLIC_HOST:-PUBLIC_HOST-not-set}:verify#key-0
      INJI_KEYSTORE_FILE_PASS: mosip
      INJI_VERIFY_REDIRECT_URI: https://${PUBLIC_HOST:-PUBLIC_HOST-not-set}
      INJI_VERIFY_RESPONSE_CODE_EXPIRY_TIME_IN_MINS: "5"
      INJI_VERIFY_CLAIMS_WITH_META_DATA: _sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti
      VERIFY_CONTEXT_PATH: /v1/verify
    depends_on:
      - postgres
    logging: *logging

  verify-ui:
    profiles: [verify]
    image: ${VERIFY_UI_IMAGE:-injistackqa/inji-verify-ui@sha256:51961ddcdf7657bd10baee6a3fecc58e839194be03aba77ee66c1d091f14a269}
    platform: linux/amd64
    # Reached through the gateway on port 3000, not published directly.
    environment:
      DEFAULT_TITLE: Inji Verify
      DEFAULT_LANG: en
      INTERNET_CONNECTIVITY_CHECK_ENDPOINT: https://dns.google/
      INTERNET_CONNECTIVITY_CHECK_TIMEOUT: "10000"
      VERIFIABLE_CLAIMS_CONFIG_URL: /assets/config.json
      VP_SUBMISSION_SUPPORTED: "false"
      CLIENT_ID: inji-verify-ui
      CLIENT_ID_DID: decentralized_identifier:did:web:${PUBLIC_HOST:-PUBLIC_HOST-not-set}:v1:verify
      DISPLAY_TIMEOUT: "120000"
      # New in release-1.0.x; values as in upstream's own compose. Neither is on the
      # conformance path, which talks to the service API directly.
      CLIENT_ID_X509: x509_san_dns:test.example.com
      ENABLE_DC_API: "false"
    volumes:
      # Our copy, with the conformance credential added. See docker/inji-verify/README.md.
      - ./inji-verify/config.json:/usr/share/nginx/html/assets/config.json:ro
    depends_on:
      - verify-service
    logging: *logging

  postgres:
    profiles: [verify]
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inji_verify
    volumes:
      # Our copy, with the F-10 fix: the shipped script breaks every VP submission.
      - ./inji-verify/db-init:/docker-entrypoint-initdb.d:ro
      - verify-db:/var/lib/postgresql/data
    logging: *logging

  # --- Public tunnel (profile: tunnel) ----------------------------------------------
  # Optional. Serves PUBLIC_HOST from this stack. Leave it out if an ngrok agent already
  # runs on the host for the same domain -- a free ngrok account allows one session.

  tunnel:
    profiles: [tunnel]
    image: ngrok/ngrok:${NGROK_IMAGE_TAG:-latest}
    command: ["http", "--url=https://${PUBLIC_HOST:-PUBLIC_HOST-not-set}", "gateway:80", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - gateway
    logging: *logging

  # --- Gateway (profiles: verify, certify) ------------------------------------------
  # One public hostname for both components; see gateway/nginx.conf. ngrok -- on the host or
  # the tunnel profile -- forwards to this, on port 3000.

  gateway:
    profiles: [verify, certify]
    image: nginx:stable
    ports:
      - "3000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *logging

  # --- Inji Certify 1.0 (profile: certify) ------------------------------------------
  # The release-1.0.x build (MOSIP's QA image), pinned by digest: the published 1.0.0-alpha.1
  # has no DPoP, which the OID4VCI 1.0 issuer plan's FAPI 2.0 base requires. Configuration
  # from release-1.0.x, adjusted as recorded in inji-certify/README.md. Mimoto and Inji Web,
  # also in Certify's own compose file, are the wallet side -- here the suite is the wallet.

  certify-db:
    profiles: [certify]
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      default:
        aliases: [database]   # the hostname Certify's configuration expects
    volumes:
      - ./inji-certify/certify_init.sql:/docker-entrypoint-initdb.d/certify_init.sql:ro
      - certify-db:/var/lib/postgresql/data
    logging: *logging

  certify:
    profiles: [certify]
    image: injistackqa/inji-certify-with-plugins@${CERTIFY_DIGEST:-sha256:2c72a78cd3c54d9bfdaf58489123cd78aa3f7d12108fdf4546fc28591b593c24}
    user: root
    ports:
      - "8090:8090"
    environment:
      container_user: mosip
      active_profile_env: default, csvdp-farmer
      SPRING_CONFIG_NAME: certify
      SPRING_CONFIG_LOCATION: /home/mosip/config/
      enable_certify_artifactory: "false"
      download_hsm_client: "false"
      mosip_certify_domain_url: https://${PUBLIC_HOST:-PUBLIC_HOST-not-set}
      # Read by the configuration files for the authorisation server and did:web URLs.
      PUBLIC_HOST: ${PUBLIC_HOST:-PUBLIC_HOST-not-set}
    volumes:
      - ./inji-certify/config/certify-default.properties:/home/mosip/config/certify-default.properties:ro
      - ./inji-certify/config/certify-csvdp-farmer.properties:/home/mosip/config/certify-csvdp-farmer.properties:ro
      - ./inji-certify/config/farmer_identity_data.csv:/home/mosip/config/farmer_identity_data.csv:ro
      - ./inji-certify/config/vp_request_config.json:/home/mosip/config/vp_request_config.json:ro
      - ./inji-certify/context/farmer-context.json:/home/mosip/context/farmer-context.json:ro
      # Certify generates its signing keystore here on first start.
      - certify-keys:/home/mosip/CERTIFY_PKCS12
    depends_on:
      - certify-db
    logging: *logging

  certify-nginx:
    profiles: [certify]
    image: nginx:stable
    volumes:
      - ./inji-certify/certify-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./inji-certify/config/mimoto-issuers-config.json:/config/server/mimoto-issuers-config.json:ro
      - ./inji-certify/config/mimoto-trusted-verifiers.json:/config/server/mimoto-trusted-verifiers.json:ro
      - ./inji-certify/config/credential-template.html:/config/server/credential-template.html:ro
      - ./inji-certify/config/vp_request_config.json:/config/server/vp_request_config.json:ro
    depends_on:
      - certify
    logging: *logging

volumes:
  suite-mongo:
  verify-db:
  certify-db:
  certify-keys:
